
<!DOCTYPE html><html lang="pl"><head>        <meta charset="UTF-8">        <meta name="viewport" content="width=device-width, initial-scale=1.0">        <title>LIONESS SYSTEM - ADMIN</title>        <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>        <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>        <style>                body{margin:0;background:#071529;color:#fff;font-family:Arial;padding:15px;box-sizing:border-box}                *,*:before,*:after{box-sizing:inherit}                .app{display:grid;grid-template-columns:1fr 420px;gap:20px;max-width:1300px;margin:auto}                .panel{background:#0f2743;padding:15px;border-radius:12px;margin-bottom:10px}                .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}                .cell{padding:10px;background:#0b1e33;border-radius:6px;text-align:center;cursor:pointer;min-height:50px}                .header-cell{padding:5px;background:#163a63;border-radius:4px;text-align:center;font-weight:bold;font-size:12px;color:#f2c94c}                .selected{border:2px solid #f2c94c}                .today{box-shadow:0 0 10px #f2c94c; border: 2px solid #f2c94c !important}                .hour{display:flex;justify-content:space-between;padding:10px;background:#0b1e33;margin-bottom:5px;border-radius:6px;align-items:center;overflow:hidden;gap:10px}                .hour.red{border:1px solid #e74c3c;background:#2c1a1a}                .hour.multi-car{border:1px solid #00d2ff;background:#0a365c}                .hour.blocked{border:1px solid #3498db;background:#1e3d59}                button{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:12px;margin-top:0}                .blue{background:#163a63;color:#fff}.green{background:#2ecc71;color:#fff}.red{background:#e74c3c;color:#fff}.lightblue{background:#3498db;color:#fff}                input,select{width:100%;padding:10px;margin:5px 0;border-radius:6px;border:none;background:#132b4a;color:#fff;box-sizing:border-box}                .calc{background:#10243f;padding:10px;border-radius:8px;margin-top:10px;font-size:14px}                .live{display:flex;gap:10px;align-items:center;margin-bottom:10px}                .lamp{width:12px;height:12px;border-radius:50%;background:#00ff88;box-shadow:0 0 10px #00ff88}                .service-row{display:flex;gap:5px;align-items:center;margin-top:5px;font-size:13px}                @media (max-width: 850px) { .app { grid-template-columns: 1fr; } body { padding: 5px; } .panel { padding: 10px; } }        </style></head><body><div class="app">        <div>                <div class="panel">                        <div class="live"><div class="lamp"></div><div><b>LIVE SYSTEM</b> | LIONESS Mobilna Wulkanizacja</div></div>                        <div style="display:flex;justify-content:space-between;align-items:center">                                <button style="width:auto" class="blue" onclick="prev()">‹</button>                                <h3 id="month" style="margin:0"></h3>                                <button style="width:auto" class="blue" onclick="next()">›</button>                        </div>                        <div class="grid" id="cal" style="margin-top:10px"></div>                </div>                <div class="panel">                        <h3>🆕 Nowi Partnerzy</h3><div id="pendingList"></div>                        <h3>✅ Zatwierdzeni Partnerzy (Statystyki i Raporty)</h3><div id="approvedList"></div>                </div>                <div class="panel">                        <h3>🧾 Usługi</h3>                        <input id="sName" placeholder="Nazwa usługi"><input id="sPrice" placeholder="Cena">                        <button id="addSBtn" class="green" onclick="addService()">Dodaj usługę</button>                        <div id="serviceList" style="margin-top:10px"></div>                </div>                <div class="panel">                        <h3>🏢 Firma</h3>                        <input id="firmAddr" placeholder="Adres firmy"><input id="freeKm" placeholder="Free km"><input id="priceKm" placeholder="Cena za km">                        <button class="blue" onclick="saveFirm()">Zapisz firmę</button>                </div>        </div>        <div>                <div class="panel">                        <h3 id="dateTitle">Wybierz dzień <span id="partnerLabel"></span></h3>                        <div id="hours"></div>                        <div id="form" style="display:none;margin-top:10px">                                <h3 id="time"></h3>                                <label style="font-size: 12px; color: #aaa;">Przypisz partnera:</label>                                <select id="partnerPick"></select>                                <input id="name" placeholder="Imię klienta" oninput="checkForm()">                                <input id="phone" placeholder="Telefon" oninput="checkForm()">                                <input id="addr" placeholder="Adres klienta" oninput="checkForm('calc')">                                                                <label style="font-size: 13px; color: #ccc;">Ilość aut:</label>                                <select id="carCount" onchange="updateCarFields(); checkForm('calc')">                                        <option value="1">1 auto</option><option value="2">2 auta</option><option value="3">3 auta</option>                                        <option value="4">4 auta</option><option value="5">5 aut</option><option value="6">6 aut</option>                                        <option value="7">7 aut</option><option value="8">8 aut</option>                                </select>                                <div id="regFields"></div>                                <div class="calc" id="calcBox">Wynik kalkulacji...</div>                                <button id="saveBtn" class="green" onclick="save()" disabled>POTWIERDZAM REZERWACJĘ</button>                                <button class="red" onclick="deleteBooking()" id="delBtn" style="display:none;">USUŃ</button>                                <button class="blue" onclick="closeF()">Anuluj</button>                        </div>                </div>        </div></div><script>        firebase.initializeApp({apiKey:"AIzaSyAG1ukkWJC_05JCeZp41EhyoVJ2Cl58",databaseURL:"https://kalendar-f5dd9-default-rtdb.firebaseio.com"});        const db=firebase.database();        let d=new Date(), sel=null, hour=null, editServiceId=null, services={}, bookings={}, approvedPartners={}, firm={address:"Rzeczna 4/15 Poznań 61-013",freeKm:5,priceKm:10};        let filterP = "ALL";        let calcTimeout = null;        const HOURS=["07:00","09:00","11:00","13:00","15:00","17:00","19:00","21:00"];        db.ref("services").on("value",s=>{services=s.val()||{};renderServices();});        db.ref("bookings").on("value",s=>{bookings=s.val()||{};render();if(sel)renderHours();renderList();});        db.ref("settings").on("value",s=>{if(s.val()){firm=s.val();document.getElementById("firmAddr").value=firm.address||"";document.getElementById("freeKm").value=firm.freeKm||"";document.getElementById("priceKm").value=firm.priceKm||"";}});        db.ref("approved_partners").on("value",s=>{approvedPartners=s.val()||{};renderPartnerPick();renderList();});        async function geocode(a){try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(a)}`);const d=await r.json();return d[0]?{lat:+d[0].lat,lon:+d[0].lon}:null;}catch(e){return null;}}        async function getKm(a,b){const x=await geocode(a);const y=await geocode(b);if(!x||!y)return 5;try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${x.lon},${x.lat};${y.lon},${y.lat}?overview=false`);const j=await r.json();if(j.routes&&j.routes[0]&&j.routes[0].distance){return j.routes[0].distance/1000;}}catch(e){}let R=6371;let dLat=(y.lat-x.lat)*Math.PI/180;let dLon=(y.lon-x.lon)*Math.PI/180;let lat1=x.lat*Math.PI/180;let lat2=y.lat*Math.PI/180;let a_h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.sin(dLon/2)*Math.sin(dLon/2)*Math.cos(lat1)*Math.cos(lat2);let c=2*Math.atan2(Math.sqrt(a_h),Math.sqrt(1-a_h));return (R*c)*1.3;}                function checkForm(runCalc){            let valid=document.getElementById("name").value&&document.getElementById("phone").value&&document.getElementById("addr").value;            document.querySelectorAll('.regInputs').forEach(i => { if(!i.value) valid=false; });            document.querySelectorAll('.servicePickers').forEach(s => { if(!s.value) valid=false; });            document.getElementById("saveBtn").disabled=!valid;            if(runCalc){ clearTimeout(calcTimeout); calcTimeout = setTimeout(calc, 400); }        }
        function updateCarFields() {            let count = document.getElementById("carCount").value;            let container = document.getElementById("regFields");            container.innerHTML = "";            let options = '<option value="">Wybierz usługę</option>';            Object.keys(services).forEach(k => {                options += `<option value="${k}">${services[k].name} (${services[k].price} zł)</option>`;            });            for(let i=1; i<=count; i++) {                 container.innerHTML += `<div style="border-bottom:1px solid #163a63; margin-bottom:5px; padding-bottom:5px;"><input class="regInputs" placeholder="Numer rejestracyjny auta ${i}" oninput="checkForm('calc')"><select class="servicePickers" onchange="checkForm('calc')">${options}</select></div>`;            }        }
        async function calc(){                                let addr=document.getElementById("addr").value;                let calcBox=document.getElementById("calcBox");                if(addr.length<5){calcBox.innerHTML="Wpisz adres..."; return;}                calcBox.innerHTML="Liczenie trasy...";                                let km=await getKm(firm.address||"Rzeczna 4/15 Poznań 61-013", addr);                let extra=km > firm.freeKm ? (km-firm.freeKm)*firm.priceKm : 0;                                let totalSvc = 0;                let serviceNames = [];                let pickers = document.querySelectorAll('.servicePickers');                pickers.forEach((s, index) => {                    if(services[s.value]) {                        let basePrice = parseFloat(services[s.value].price);                        let carPrice = basePrice + (index === 0 ? extra : 0);                        totalSvc += carPrice;                        serviceNames.push(services[s.value].name);                    }                });

                let total = totalSvc.toFixed(2);                let svcText = serviceNames.length > 0 ? serviceNames.join(", ") : "Usługa";                                calcBox.innerHTML=`<b>${svcText}</b><br>Dojazd: ${km.toFixed(1)} km<br>Extra (tylko 1. auto): ${extra.toFixed(2)} zł<br><b>RAZEM: <span id="finalTotal">${total}</span> zł</b>`;        }

        function renderPartnerPick(){            let pSelect = document.getElementById("partnerPick");            pSelect.innerHTML = '<option value="ADMIN">ADMIN (Główny)</option>';            Object.entries(approvedPartners).forEach(([k, v]) => {                pSelect.innerHTML += `<option value="${k}">${v.name}</option>`;            });        }
        db.ref("pending_partners").on("value", s=>{                let l=document.getElementById("pendingList"); l.innerHTML="";                Object.entries(s.val()||{}).forEach(([k,v])=>l.innerHTML+=`<div class="service-row">${v.name} <button class="green" style="width:auto" onclick="approve('${k}')">Zatwierdź</button></div>`);        });

        function renderList() {            let l=document.getElementById("approvedList");             let monthName = d.toLocaleString("pl-PL", {month:"long", year:"numeric"});            l.innerHTML=`<button class="blue" style="margin-bottom:8px" onclick="filterP='ALL'; renderHours()">Wszyscy partnerzy</button>`;            let mStr = `${d.getFullYear()}-${d.getMonth()+1}`;            Object.entries(approvedPartners).forEach(([k,v]) => {                let count = 0;                Object.entries(bookings).forEach(([date, hours]) => {                    if(date.startsWith(mStr)) Object.values(hours).forEach(b => { if(b.partnerId === k && b.isMainSlot && !b.blocked) count += (b.carCount || 1); });                });                l.innerHTML += `                    <div class="panel" style="margin-top:10px; font-size: 13px; background: #132b4a">                        <div style="display:flex; justify-content:space-between; align-items:center;">                            <b>${v.name}</b>                            <button class="red" style="width:auto; padding: 2px 8px; margin:0;" onclick="deletePartner('${k}')">X</button>                        </div>                        💳 Konto: ${v.bankAccount || "Brak"}<br>                        📈 Statystyki (${monthName}): <b>${count}</b> aut | Do wypłaty: <b>${count * 50} zł</b>                        <div style="display:flex; gap:5px; margin-top:5px;">                            <button class="blue" style="margin:0; padding:6px;" onclick="filterP='${k}'; renderHours()">Kalendarz</button>                            <button class="green" style="margin:0; padding:6px;" onclick="printReport('${k}', '${v.name}')">Drukuj Raport</button>                        </div>                    </div>`;            });        }

        function printReport(pID, pName) {            let mStr = `${d.getFullYear()}-${d.getMonth()+1}`;            let monthName = d.toLocaleString("pl-PL", {month:"long", year:"numeric"});            let win = window.open('', '_blank');            let html = `<html><head><meta charset="utf-8"><title>Raport - ${pName}</title></head><body style="font-family:Arial; padding:20px;"><h2>Raport partnera: ${pName}</h2><h3>Miesiąc: ${monthName}</h3><table border="1" cellspacing="0" cellpadding="8" width="100%"><tr><th>Data</th><th>Godzina</th><th>Klient</th><th>Telefon</th><th>Adres</th><th>Auta i Usługi</th><th>Kwota</th></tr>`;            let c = 0;            Object.entries(bookings).forEach(([date, hours]) => {                if(date.startsWith(mStr)) {                    Object.entries(hours).forEach(([time, b]) => {                        if(b.partnerId === pID && b.isMainSlot && !b.blocked) {                            let carsStr = "";                            if(b.cars && Array.isArray(b.cars)) {                                b.cars.forEach((car, idx) => {                                    carsStr += `Auto ${idx+1}: ${car.reg} (${car.serviceName})<br>`;                                });                            } else {                                carsStr = `${b.reg || ''} (${b.note || ''})`;                            }                            html += `<tr><td>${date}</td><td>${time}</td><td>${b.name}</td><td>${b.phone}</td><td>${b.addr}</td><td>${carsStr}</td><td>${parseFloat(b.totalPrice || 0).toFixed(2)} zł</td></tr>`;                            c += (b.carCount || 1);                        }                    });                }            });            html += `</table><p><b>Łącznie aut: ${c} | Do wypłaty: ${c * 50} zł</b></p><button style="padding:10px 20px; font-size:16px; cursor:pointer;" onclick="window.print()">Drukuj raport</button></body></html>`;            win.document.write(html);        }

        function approve(k) { db.ref("pending_partners/"+k).once('value', s => { db.ref("approved_partners/"+k).set(s.val()); db.ref("pending_partners/"+k).remove(); }); }        function deletePartner(k) { if(confirm("Czy na pewno usunąć?")) db.ref("approved_partners/"+k).remove(); }

        function render(){                let c=document.getElementById("cal"); c.innerHTML=""; let y=d.getFullYear(), m=d.getMonth();                let now=new Date(); let todayStr=`${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;                document.getElementById("month").innerText=d.toLocaleString("pl-PL",{month:"long",year:"numeric"});                ['Pon', 'Wt', 'Śr', 'Cz', 'Pt', 'So', 'Nd'].forEach(dayName => {                    let headerDiv = document.createElement("div");                    headerDiv.className = "header-cell";                    headerDiv.innerText = dayName;                    c.appendChild(headerDiv);                });                let firstDayIndex = new Date(y, m, 1).getDay();                let startingSpaces = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;                for(let i=0; i<startingSpaces; i++){                    let emptyDiv = document.createElement("div");                    c.appendChild(emptyDiv);                }                let totalDays = new Date(y, m + 1, 0).getDate();                for(let i=1; i<=totalDays; i++){                        let key=`${y}-${m+1}-${i}`, count=0;                        if(bookings[key]) {                            Object.values(bookings[key]).forEach(b => { if(!b.blocked) count++; });                        }                        let div=document.createElement("div"); div.className="cell"+(sel===key?" selected":"")+(key===todayStr?" today":"");                        div.innerHTML=`${i}<br><small>${HOURS.length-count} wolnych</small>`;                        div.onclick=()=>{sel=key;render();renderHours();};c.appendChild(div);                }        }

        function renderHours(){                document.getElementById("partnerLabel").innerText = filterP === "ALL" ? "" : " (Partner: " + (approvedPartners[filterP]?.name || filterP) + ")";                let h=document.getElementById("hours"); h.innerHTML=""; let day=bookings[sel]||{};                HOURS.forEach(t=>{                        let r=day[t];                        if(filterP !== "ALL" && r?.partnerId !== filterP) return;                                                let div=document.createElement("div");                        if(r && r.blocked) {                            div.className="hour blocked";                            div.innerHTML=`<div style="font-size: 13px; word-break: break-word;"><b>${t}</b><br><span style="color:#3498db; font-weight:bold;">ZABLOKOWANE</span></div><button class="lightblue" style="width:auto; flex-shrink:0;" onclick="toggleBlock('${t}')">Odblokuj</button>`;                        } else if(r) {                            let carCount = parseInt(r.carCount) || 1;                            div.className = "hour " + (carCount > 1 ? "multi-car" : "red");                            let carsHtml = "";                            if(r.cars && Array.isArray(r.cars)) {                                r.cars.forEach((car, index) => {                                    let carExtra = index === 0 && r.details && parseFloat(r.details.extra) > 0 ? ` (Dojazd: ${r.details.km} km, Extra: ${r.details.extra} zł)` : ` (Dojazd: 0 km, Extra: 0 zł)`;                                    carsHtml += `<br>🚗 Auto ${index+1}: ${car.reg} (${car.serviceName}) - ${parseFloat(car.basePrice || car.price).toFixed(2)} zł${carExtra}`;                                });                            } else {                                carsHtml = `<br>🚗 ${r.reg || ''} (${r.note || ''})`;                            }                            div.innerHTML=`<div style="font-size: 13px; word-break: break-word; overflow: hidden;"><b>${t}</b><br>👤 ${r.name}<br>📞 ${r.phone}${carsHtml}<br>📍 ${r.addr}<br>💰 <b>RAZEM: ${r.totalPrice ? parseFloat(r.totalPrice).toFixed(2) + ' zł' : 'wliczone'}</b><br><small style="color:#f2c94c">Partner: ${r.partnerName || r.partnerId || 'ADMIN'}</small></div><button class="blue" style="width:auto; flex-shrink:0;" onclick="openForm('${t}')">Edytuj</button>`;                        } else {                            div.className="hour";                            div.innerHTML=`<div style="font-size: 13px;"><b>${t}</b><br>WOLNE</div><div style="display:flex; gap:5px; flex-shrink:0;"><button class="lightblue" style="width:auto;" onclick="toggleBlock('${t}')">Zablokuj</button><button class="lightblue" style="width:auto;" onclick="openForm('${t}')">Zarezerwuj</button></div>`;                        }                        h.appendChild(div);                });        }

        function renderServices(){                let list=document.getElementById("serviceList");                list.innerHTML="";                Object.keys(services).forEach(k=>{                        list.innerHTML+=`<div class="service-row"><span style="flex-grow:1">${services[k].name} (${services[k].price} zł)</span><button class="blue" style="width:auto;margin:0" onclick="editService('${k}')">E</button><button class="red" style="width:auto;margin:0" onclick="deleteService('${k}')">X</button></div>`;                });                if(document.getElementById("form").style.display === "block") updateCarFields();        }

        function addService(){let n=document.getElementById("sName").value; let p=document.getElementById("sPrice").value; if(!n||!p) return; if(editServiceId) { db.ref("services/"+editServiceId).update({name:n, price:p}); editServiceId=null; document.getElementById("addSBtn").innerText="Dodaj usługę"; } else { db.ref("services").push({name:n, price:p}); } document.getElementById("sName").value=""; document.getElementById("sPrice").value=""; }        function editService(id){editServiceId=id; document.getElementById("sName").value=services[id].name; document.getElementById("sPrice").value=services[id].price; document.getElementById("addSBtn").innerText="Zapisz zmiany";}        function deleteService(id){if(confirm("Czy na pewno usunąć?")) db.ref("services/"+id).remove();}                function toggleBlock(t) {            if(!sel) { alert("Wybierz najpierw dzień w kalendarzu!"); return; }            let r = bookings[sel]?.[t];            if(r && r.blocked) {                db.ref(`bookings/${sel}/${t}`).remove();            } else if(!r) {                db.ref(`bookings/${sel}/${t}`).set({ blocked: true });            } else {                alert("Ta godzina jest już zajęta przez klienta!");            }        }

        function openForm(t){                                hour=t; document.getElementById("form").style.display="block"; document.getElementById("time").innerText=t;                                let r=bookings[sel]?.[t];                                                document.getElementById("carCount").value = r && r.carCount ? r.carCount : "1";                updateCarFields();

                if(r && !r.blocked){                                                document.getElementById("name").value=r.name;                                                 document.getElementById("phone").value=r.phone;                                                 document.getElementById("addr").value=r.addr;                                                 document.getElementById("partnerPick").value=r.partnerId || "ADMIN";                                                document.getElementById("delBtn").style.display="inline-block";                                                                         let regInputs = document.querySelectorAll('.regInputs');                        let servicePickers = document.querySelectorAll('.servicePickers');                        if(r.cars && Array.isArray(r.cars)) {                            r.cars.forEach((car, idx) => {                                if(regInputs[idx]) regInputs[idx].value = car.reg || "";                                if(servicePickers[idx]) {                                    for(let opt of servicePickers[idx].options) {                                        if(services[opt.value] && services[opt.value].name === car.serviceName) {                                            servicePickers[idx].value = opt.value;                                            break;                                        }                                    }                                }                            });                        } else {                            if(regInputs[0]) regInputs[0].value = r.reg || "";                        }

                        calc();                                 }                                else {                                                document.getElementById("name").value="";                                                 document.getElementById("phone").value="";                                                 document.getElementById("addr").value="";                                                 document.getElementById("partnerPick").value = filterP === "ALL" ? "ADMIN" : filterP;                                                document.getElementById("delBtn").style.display="none";                                                 document.getElementById("calcBox").innerHTML="Wynik kalkulacji...";                 }                                checkForm(true);         }

        async function save(){                                let addr = document.getElementById("addr").value;                                let km = await getKm(firm.address||"Rzeczna 4/15 Poznań 61-013", addr);                                let extra = km > firm.freeKm ? (km - firm.freeKm) * firm.priceKm : 0;                                                let count = parseInt(document.getElementById("carCount").value) || 1;                let regInputs = document.querySelectorAll('.regInputs');                let servicePickers = document.querySelectorAll('.servicePickers');                                let pID = document.getElementById("partnerPick").value;                let pName = (pID === "ADMIN") ? "ADMIN" : (approvedPartners[pID]?.name || pID);                
                let carsData = [];                for(let i = 0; i < regInputs.length; i++) {                    if(!regInputs[i].value || !servicePickers[i].value) return alert("Wypełnij nr rej. i usługę dla każdego auta!");                    let srv = services[servicePickers[i].value] || {name: "Usługa", price: 0};                    let basePrice = parseFloat(srv.price || 0);                    let carPrice = basePrice + (index_check = (i === 0 ? extra : 0));                    carsData.push({                        reg: regInputs[i].value,                        serviceName: srv.name,                        basePrice: basePrice,
                        price: parseFloat(carPrice.toFixed(2))                    });                }

                let total = parseFloat(carsData.reduce((sum, car) => sum + car.price, 0).toFixed(2));

                let slotsNeeded = 1;                if (count >= 2 && count <= 3) slotsNeeded = 2;                else if (count >= 4 && count <= 5) slotsNeeded = 3;                else if (count >= 6 && count <= 8) slotsNeeded = 4;

                let dayBookings = bookings[sel] || {};                let startIndex = HOURS.indexOf(hour);                if (startIndex === -1) startIndex = 0;

                let foundBlock = null;                for (let i = startIndex; i <= HOURS.length - slotsNeeded; i++) {                    let ok = true;                    let blockHours = [];                    for (let j = 0; j < slotsNeeded; j++) {                        let hSlot = HOURS[i + j];                        if (dayBookings[hSlot] && hSlot !== hour) {                            ok = false;                            break;                        }                        blockHours.push(hSlot);                    }                    if (ok) {                        foundBlock = blockHours;                        break;                    }                }

                if (!foundBlock) {                    alert("Brak wolnych miejsc w wybranych godzinach!");                    return;                }

                for (let i = 0; i < slotsNeeded; i++) {                    let targetHour = foundBlock[i];                    db.ref(`bookings/${sel}/${targetHour}`).set({                                                name: document.getElementById("name").value,                                                 phone: document.getElementById("phone").value,                                                 addr: addr,                                                 totalPrice: (i === 0) ? total : 0,                                                 carCount: count,                                                 isMainSlot: (i === 0),                                                 cars: carsData,                                                 details: {                                                    km: (i === 0 ? km.toFixed(1) : "0.0"),                                                    extra: (i === 0 ? extra.toFixed(2) : "0.00")                                                 },                                                partnerId: pID,                                                partnerName: pName                                    });                }

                closeF();                }

        function deleteBooking(){db.ref(`bookings/${sel}/${hour}`).remove();closeF();}                function closeF(){document.getElementById("form").style.display="none";}                function saveFirm(){                                let newFirm = {address: document.getElementById("firmAddr").value, freeKm: parseFloat(document.getElementById("freeKm").value), priceKm: parseFloat(document.getElementById("priceKm").value)};                                db.ref("settings").set(newFirm).then(() => { firm = newFirm; alert("Zapisano ustawienia firmy!"); });        }                function prev(){d.setMonth(d.getMonth()-1);render();renderList();}                function next(){d.setMonth(d.getMonth()+1);render();renderList();}                render();</script></body></html>
